# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── Database (H2 in-memory for dev; swap for MySQL/Postgres in prod) ────────
spring.datasource.url=jdbc:h2:mem:smedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=SMEManager2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!
app.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200

# ── Mail (configure SMTP for Teams / email notifications) ────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Teams Webhook (replace with actual webhook URL) ──────────────────────────
app.teams.webhook.url=https://outlook.office.com/webhook/your-webhook-id
app.teams.notification.enabled=false

# ── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.smemanager=DEBUG
logging.level.org.springframework.security=INFO
